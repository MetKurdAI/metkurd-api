openapi: 3.1.0
info:
  title: MetKurd REST API V2
  version: '2'
  description: Official MetKurd REST API V2 customer contract. Account/service availability, limits and
    entitlements depend on the current MetKurd account and plan. Generation is asynchronous. Request schemas
    describe recommended functional fields; compatibility observations are in docs/contract-notes.md.
    Apache-2.0 covers repository documentation and sample code only, not the hosted MetKurd API service,
    models, customer data or generated outputs.
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
servers:
- url: https://metkurd.ai/api/v2
security:
- BearerAuth: []
tags:
- name: Discovery
- name: Speech
- name: Voice Clone
- name: Multi-Speaker
- name: Speech-to-Text
- name: Caption
- name: OCR
- name: Harakat
- name: STEM
- name: Jobs
- name: Files
paths:
  /speech:
    post:
      operationId: submit_speech
      tags:
      - Speech
      summary: Submit speech
      description: Requires v2:speech, current API access and this service entitlement. Use placeholders
        only after replacing them with your actual discovered IDs. Files are local uploads. See docs/idempotency.md
        before retrying.
      x-required-scope: v2:speech
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeechRequest'
            example:
              text: سڵاو لە مێتکوردەوە
              voice: VOICE_ID
              model: '2.0'
              language: ckb
              storage_mode: temporary
      responses:
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '429':
          description: Rate or concurrent job limit exceeded. Retry-After may be absent for concurrency.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Wait time in seconds, when supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
        '202':
          description: New generation request accepted; does not wait for completion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              example:
                id: JOB_ID
                status: queued
                service: speech
                created_at: '2026-10-03T12:00:00Z'
                completed_at: null
                expires_at: '2026-10-04T12:00:00Z'
                result: null
        '200':
          description: Identical accepted replay; same job ID and current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
