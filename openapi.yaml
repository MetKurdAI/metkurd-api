      - languages
      - pause_after_ms
      - final_pause_ms
    ThetaLimits:
      allOf:
      - $ref: '#/components/schemas/BatchLimits'
      - type: object
        properties:
          max_reference_bytes:
            type: integer
          max_project_reference_bytes:
            type: integer
        required:
        - max_reference_bytes
        - max_project_reference_bytes
    Services:
      type: object
      properties:
        services:
          type: array
          items:
            type: string
            enum:
            - speech
            - voice-clone
            - transcriptions
            - captions
            - ocr
            - stem
            - zeta
            - theta
            - harakat
        speech_models:
          type: array
          items:
            type: string
            enum:
            - '1.5'
            - '2.0'
        stem_modes:
          type: array
          items:
            type: integer
            enum:
            - 2
            - 4
        service_details:
          type: object
          properties:
            zeta:
              type: object
              properties:
                name:
                  type: string
                  const: Zeta 1.0
                endpoint:
                  type: string
                  const: /api/v2/zeta
                scope:
                  type: string
                  const: v2:speech
                billing_unit:
                  type: string
                  const: character
                limits:
                  $ref: '#/components/schemas/BatchLimits'
              required:
              - name
              - endpoint
              - scope
              - billing_unit
              - limits
            theta:
              type: object
              properties:
                name:
                  type: string
                  const: Theta 1.0
                endpoint:
                  type: string
                  const: /api/v2/theta
                scope:
                  type: string
                  const: v2:voice-clone
                billing_unit:
                  type: string
                  const: character
                limits:
                  $ref: '#/components/schemas/ThetaLimits'
                reference_upload_endpoint:
                  type: string
                  const: /api/v2/references
              required:
              - name
              - endpoint
              - scope
              - billing_unit
              - limits
              - reference_upload_endpoint
            harakat:
              type: object
              properties:
                name:
                  type: string
                  const: Harakat 1.0
                endpoint:
                  type: string
                  const: /api/v2/harakat
                scope:
                  type: string
                  const: v2:harakat
                billing_unit:
                  type: string
                  const: character
                limits:
                  type: object
                  properties:
                    max_chars:
                      type: integer
                      minimum: 1
                  required:
                  - max_chars
              required:
              - name
              - endpoint
              - scope
              - billing_unit
              - limits
          required:
          - zeta
          - theta
          - harakat
      required:
      - services
      - speech_models
      - stem_modes
      - service_details
