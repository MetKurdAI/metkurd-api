  /references:
    post:
      operationId: upload_reference
      tags:
      - Voice Clone
      summary: Upload reusable voice reference
      description: Requires v2:voice-clone and Theta entitlement. Only multipart file is accepted. No
        Idempotency-Key or generation job. Stored references use quota and independent retention. Identical
        active owned content may be reused.
      x-required-scope: v2:voice-clone
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReferenceUpload'
      responses:
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '429':
          description: Rate or concurrent job limit exceeded. Retry-After may be absent for concurrency.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Wait time in seconds, when supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
        '201':
          description: Reference available; use the integer reference_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reference'
              example:
                reference_id: 123
                mime_type: audio/wav
                size_bytes: 96044
                expires_at: null
  /files/{id}/download:
    get:
      operationId: download_file
      tags:
      - Files
      summary: Download owned result bytes
      description: Requires v2:files:download, current API access and available owned result. Expired/missing/inaccessible
        files return file_not_found. Sends private/no-store cache headers.
      x-required-scope: v2:files:download
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Public ID from result.files[], not a reusable reference ID.
      responses:
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '429':
          description: Rate or concurrent job limit exceeded. Retry-After may be absent for concurrency.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Wait time in seconds, when supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: Result bytes; actual Content-Type follows the file MIME type.
          headers:
            Content-Disposition:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              example: private, no-store
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            audio/wav:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
            '*/*':
              schema:
                type: string
                format: binary
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: MetKurd API key. Required for every operation, including downloads.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Trimmed nonempty value, at most 128 bytes. New value per logical generation request;
        preserve exact input/key for retries. Account-wide identity across endpoints and credentials.
        UUID format is not required.
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: YOUR_UNIQUE_REQUEST_ID
  responses:
    Error:
      description: Public HTTP error; see docs/errors.md. Transport/gateway failures may be non-JSON.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: invalid_request
              message: Check the supplied fields.
  schemas:
    SpeechRequest:
      type: object
      properties:
        language:
          type: string
          description: Speech/transcription language.
          enum:
          - ckb
          - ar
          - en
          default: ckb
        storage_mode:
          type: string
          description: Generation output storage policy. Saved references retain their own policy.
          enum:
          - temporary
          - permanent
          default: temporary
        model:
          type: string
          enum:
          - '1.5'
          - '2.0'
          default: '2.0'
          description: Speech generation model. Send the version as a string.
        text:
          type: string
          description: Nonempty after trimming. Account/service character limit applies.
          minLength: 1
        voice:
          type: string
          description: Allowed ID from GET /voices.
          minLength: 1
      required:
      - text
      - voice
    CloneSavedRequest:
      type: object
      properties:
        language:
          type: string
          description: Speech/transcription language.
          enum:
          - ckb
          - ar
          - en
          default: ckb
        storage_mode:
          type: string
          description: Generation output storage policy. Saved references retain their own policy.
          enum:
          - temporary
          - permanent
          default: temporary
        model:
          type: string
          enum:
          - '1.5'
          - '2.0'
          default: '2.0'
          description: Speech generation model. Send the version as a string.
        text:
          type: string
          description: Nonempty after trimming. Account/service character limit applies.
          minLength: 1
        reference_text:
          type:
          - string
          - 'null'
          maxLength: 4000
          description: Optional reference transcript.
        reference_id:
          type: integer
          description: Active owned reference ID.
          minimum: 1
      required:
      - text
      - reference_id
    CloneUploadRequest:
      type: object
      properties:
        language:
          type: string
          description: Speech/transcription language.
          enum:
          - ckb
          - ar
          - en
          default: ckb
        storage_mode:
          type: string
          description: Generation output storage policy. Saved references retain their own policy.
          enum:
          - temporary
          - permanent
          default: temporary
        model:
          type: string
          enum:
          - '1.5'
          - '2.0'
          default: '2.0'
          description: Speech generation model. Send the version as a string.
        text:
          type: string
          description: Nonempty after trimming. Account/service character limit applies.
          minLength: 1
        reference_text:
          type:
          - string
          - 'null'
          maxLength: 4000
          description: Optional reference transcript.
        reference_id:
          type:
          - integer
          - 'null'
          minimum: 1
        file:
          type: string
          description: Reference audio up to 20 MiB; FLAC excluded.
          format: binary
      required:
      - text
      oneOf:
      - required:
        - file
        properties:
          reference_id:
            type: 'null'
      - required:
        - reference_id
        properties:
          reference_id:
            type: integer
            minimum: 1
        not:
          required:
          - file
    AudioRequest:
      type: object
      properties:
        language:
          type: string
          description: Speech/transcription language.
          enum:
          - ckb
          - ar
          - en
          default: ckb
        intelligent:
          oneOf:
          - type: boolean
          - type: integer
            enum:
            - 0
            - 1
          - type: string
            enum:
            - '0'
            - '1'
          default: false
          description: JSON boolean or multipart 0/1. Literal strings true/false are not accepted.
        storage_mode:
          type: string
          description: Generation output storage policy. Saved references retain their own policy.
          enum:
          - temporary
          - permanent
          default: temporary
        file:
          type: string
          description: Audio up to 100 MiB. WAV, MP3, MP4/M4A, AAC, OGG, WebM or FLAC; positive duration
            required.
          format: binary
      required:
      - file
    StemRequest:
      type: object
      properties:
        storage_mode:
          type: string
          description: Generation output storage policy. Saved references retain their own policy.
          enum:
          - temporary
          - permanent
          default: temporary
        file:
          type: string
          description: Audio up to 100 MiB. WAV, MP3, MP4/M4A, AAC, OGG, WebM or FLAC; positive duration
            required.
          format: binary
        mode:
          oneOf:
          - type: integer
            enum:
            - 2
            - 4
          - type: string
            enum:
            - '2'
            - '4'
          description: '2: vocals/accompaniment; 4: vocals/drums/bass/other.'
      required:
      - file
      - mode
    OcrRequest:
      type: object
      properties:
        intelligent:
          oneOf:
          - type: boolean
          - type: integer
            enum:
            - 0
            - 1
          - type: string
            enum:
            - '0'
            - '1'
          default: false
          description: JSON boolean or multipart 0/1. Literal strings true/false are not accepted.
        storage_mode:
          type: string
          description: Generation output storage policy. Saved references retain their own policy.
          enum:
          - temporary
          - permanent
          default: temporary
        file:
          type: string
          description: PDF/JPEG/PNG/WebP/BMP/GIF/TIFF, at most 100 MiB.
          format: binary
        pages:
          type: string
          description: 'Select 1–20 unique pages; all selects the first 20 or fewer. Examples: 1-3,5 or
            21-40.'
          maxLength: 255
          default: all
        exports:
          type: array
          items:
            type: string
            enum:
            - txt
            - docx
            - markdown
            - html
            - zip
          default:
          - txt
          - docx
          description: Send as exports[] or indexed multipart fields. Omission selects defaults; an explicit
            empty array does not. Generic repeated exports fields may not bind as an array.
      required:
      - file
    ZetaSegment:
      type: object
      properties:
        text:
          type: string
          description: Trimmed nonempty text; limits from GET /services.
          minLength: 1
        language:
          type: string
          enum:
          - ckb
          - ar
          - en
        pause_after_ms:
          type: integer
          description: Final segment pause is normalized to zero.
          enum:
          - 0
          - 500
          - 1000
          - 2000
        voice:
          type: string
          description: Allowed GET /voices ID.
      required:
      - text
      - language
      - pause_after_ms
      - voice
      additionalProperties: false
    ThetaSegment:
      type: object
      properties:
        text:
          type: string
          description: Trimmed nonempty text; limits from GET /services.
          minLength: 1
        language:
          type: string
          enum:
          - ckb
          - ar
          - en
        pause_after_ms:
          type: integer
          description: Final segment pause is normalized to zero.
          enum:
          - 0
          - 500
          - 1000
          - 2000
        reference_id:
          type: integer
          description: Owned reference ID.
          minimum: 1
        reference_text:
          type:
          - string
          - 'null'
          maxLength: 4000
          description: Optional reference transcript.
      required:
      - text
      - language
      - pause_after_ms
      - reference_id
      additionalProperties: false
    ZetaRequest:
      type: object
      properties:
        segments:
          type: array
          items:
            $ref: '#/components/schemas/ZetaSegment'
          minItems: 1
          description: Ordered segments. Discover current maximum count/character limits through GET /services.
        storage_mode:
          type: string
          description: Generation output storage policy. Saved references retain their own policy.
          enum:
          - temporary
          - permanent
          default: temporary
      required:
      - segments
      additionalProperties: false
    ThetaRequest:
      type: object
      properties:
        segments:
          type: array
          items:
            $ref: '#/components/schemas/ThetaSegment'
          minItems: 1
          description: Ordered segments. Discover current maximum count/character limits through GET /services.
        storage_mode:
          type: string
          description: Generation output storage policy. Saved references retain their own policy.
          enum:
          - temporary
          - permanent
          default: temporary
      required:
      - segments
      additionalProperties: false
    HarakatRequest:
      type: object
      properties:
        text:
          type: string
          description: Nonempty UTF-8 text. Trimmed; max_chars from GET /services.
          minLength: 1
        storage_mode:
          type: string
          description: Generation output storage policy. Saved references retain their own policy.
          enum:
          - temporary
          - permanent
          default: temporary
      required:
      - text
      additionalProperties: false
    ReferenceUpload:
      type: object
      properties:
        file:
          type: string
          description: Reference audio up to 20 MiB; FLAC excluded. This upload uses storage quota.
          format: binary
      required:
      - file
      additionalProperties: false
    Reference:
      type: object
      properties:
        reference_id:
          type: integer
          minimum: 1
        mime_type:
          type: string
        size_bytes:
          type: integer
          minimum: 0
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - reference_id
      - mime_type
      - size_bytes
      - expires_at
    ErrorDetail:
      type: object
      properties:
        code:
          type: string
          enum:
          - invalid_request
          - authentication_failed
          - permission_denied
          - insufficient_credits
          - rate_limit_exceeded
          - invalid_file
          - unsupported_format
          - job_not_found
          - file_not_found
          - processing_failed
          - storage_limit_exceeded
          - server_error
          - idempotency_conflict
          - concurrency_limit_exceeded
        message:
          type: string
        fields:
          type: array
          items:
            type: string
      required:
      - code
      - message
    Error:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
    ResultFile:
      type: object
      properties:
        id:
          type: string
          description: Opaque public file ID.
        kind:
          type: string
          description: Role label; not a closed enum.
        mime_type:
          type: string
        size_bytes:
          type: integer
          minimum: 0
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        download_url:
          type: string
          description: Requires Bearer authentication. Validate the origin before sending credentials.
          format: uri
      required:
      - id
      - kind
      - mime_type
      - size_bytes
      - expires_at
      - download_url
    CaptionSegment:
      type: object
      properties:
        start:
          description: Start time, normally seconds, when present. Value type is not normalized; parse
            defensively.
        end:
          description: End time, normally seconds, when present. Value type is not normalized; parse defensively.
        text:
          description: Caption text when present. Value type is not normalized; parse defensively.
      additionalProperties: false
    Result:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/ResultFile'
        expired:
          type: boolean
          const: true
        text:
          type: string
          description: Leo/Caption/OCR, or Harakat while files are available.
        srt:
          type:
          - string
          - 'null'
          description: Caption only.
        segments:
          type: array
          items:
            $ref: '#/components/schemas/CaptionSegment'
          description: Caption only; fields are present when persisted.
        segment_count:
          type: integer
          description: Zeta/Theta only.
        total_chars:
          type: integer
          description: Zeta/Theta only.
        duration:
          type: number
          minimum: 0
          description: Zeta/Theta final audio duration in seconds.
        characters:
          type: integer
          description: Harakat only, while files are available.
        words:
          type: integer
          description: Harakat only, while files are available.
        lines:
          type: integer
          description: Harakat only, while files are available.
        chunks:
          type: integer
          description: Harakat only, while files are available.
      required:
      - files
    Job:
      type: object
      properties:
        id:
          type: string
          description: Opaque public job ID.
        status:
          type: string
          enum:
          - queued
          - processing
          - completed
          - failed
          - cancelled
        service:
          type: string
          enum:
          - speech
          - voice-clone
          - transcriptions
          - captions
          - ocr
          - stem
          - zeta
          - theta
          - harakat
        created_at:
          type: string
          format: date-time
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        result:
          anyOf:
          - $ref: '#/components/schemas/Result'
          - type: 'null'
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - id
      - status
      - service
      - created_at
      - completed_at
      - expires_at
      - result
      description: Same envelope for submit/replay/read. result is null unless completed; failed jobs
        include error. Expired completed results contain only expired:true and files:[].
      allOf:
      - if:
          properties:
            status:
              const: failed
        then:
          required:
          - error
          properties:
            error:
              properties:
                code:
                  enum:
                  - processing_failed
                  - storage_limit_exceeded
                  - insufficient_credits
    Voices:
      type: object
      properties:
        voices:
          type: array
          items:
            type: object
            properties:
